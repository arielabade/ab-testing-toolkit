[project]
name = "ab-testing-toolkit"
version = "0.1.0"
description = "Experiment design, frequentist and Bayesian analysis, CUPED variance reduction, and a decision report"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "statsmodels>=0.14", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
